<!doctype html>

<html lang="en">
    <head>
        <title> Twitter Translator Extension </title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
        <link rel="stylesheet" href="popup.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    </head>

    <body>
        <header>
            <div class="left-side-header">
                <img src="../icons/translation_128.png" alt="Translation Icon">
                <h2> Twitter Translator </h2>
            </div>
        </header>

        <main>
            <!-- <div class="line-container">
                <div id="line"></div>
            </div> -->
            <div class="options">
                <div class="option-row">
                    <label for="language-item-input"> Enter your preferred language: </label>
                    <div class="dropdown" id="target-language-dropdown">
                        <!-- display currently selected value -->
                        <div class="selected-item">
                            <input type="text" id="language-item-input" value="Select" readonly>
                        </div>
                        <div class="dropdown-content">
                            <div class="search-input">
                                <!-- user types search text here to filter options-->
                                <input type="text" name="" id="" placeholder="Search...">
                            </div>
                            <ul class="options-list">
                                <!-- display list of all options -->
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="option-row">
                    <label for="text-colour-select"> Select text colour: </label>
                    <div class ="colour-picker-container">
                        <input type="color" id="text-colour-select" class="colour-picker" value="#000000">
                        <span class="colour-value"></span>
                    </div>
                </div>
                <div class="option-row">
                    <label for="font-item-input"> Enter your preferred font: </label>
                    <div class="dropdown" id="target-font-dropdown">
                        <div class="selected-item">
                            <input type="text" id="font-item-input" value="Select" readonly>
                        </div>
                        <div class="dropdown-content">
                            <div class="search-input">
                                <input type="text" name="" id="" placeholder="Search...">
                            </div>
                            <ul class="options-list">
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
            
        </main>
        <script src="../dist/popup/popup.js"></script>
    </body>
</html>
